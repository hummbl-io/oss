version: 2
updates:
  # GitHub Actions version updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "actions/*"
          - "github/*"

  # Python pip dependencies (governed-compression uses numpy, hummbl-rubric-templates uses pyyaml)
  - package-ecosystem: pip
    directory: /packages/python/governed-compression
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /packages/python/hummbl-rubric-templates
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /packages/python/hummbl-free-models
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
