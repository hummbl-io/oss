name: Dependency review

# Checks PRs for vulnerable dependencies and license issues.
# Runs on every pull request that modifies package files.

"on":
  pull_request:
    paths:
      - "packages/**/pyproject.toml"
      - "packages/**/requirements*.txt"
      - ".github/workflows/dependency-review.yml"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    # This job runs unconditionally. The 2026-09-16 note about GHAS gating
    # was never implemented as an `if:` condition and is stale: this repo is
    # public, where dependency review does not require a GHAS license, and
    # runs conclude success. If the repo ever goes private, gate this job on
    # vars.HUMMBL_GHAS_ENABLED at that time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: moderate
