name: Dependency review

# Checks PRs for vulnerable dependencies and license issues.
# Runs on every pull request that modifies package files.

"on":
  pull_request:
    paths:
      - "packages/**/pyproject.toml"
      - "packages/**/requirements*.txt"
      - ".github/workflows/dependency-review.yml"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9
        with:
          fail-on-severity: moderate
        # Non-blocking until Dependency Graph is enabled in repo settings:
        # Settings -> Code & automation -> Actions -> Dependency graph
        # Once enabled, remove continue-on-error to make this a hard gate.
        continue-on-error: true
