name: Tests

"on":
  push:
    branches: [main]
  pull_request:

# Always run. Path filters made the Tests workflow vanish on docs-only PRs,
# so it could not be a required status check without starving those PRs.
# See docs/operations/MERGE.md and #91.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Matrix computation: full package set on push to main; changed packages only
  # on pull_request. A PR that touches no package gets the flagship package as
  # a smoke floor so the required `test` check still runs and goes green --
  # path filters were removed in #91 precisely because a vanished Tests
  # workflow starved required checks on docs-only PRs (see MERGE.md).
  #
  # Changes to this workflow file itself force the full matrix so a matrix
  # edit can never ship untested.
  # ---------------------------------------------------------------------------
  changes:
    name: Compute test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Package set = directories under packages/python that carry tests;
          # identical to the former hardcoded matrix (verified: all 46 have tests/).
          ALL=$(find packages/python -maxdepth 2 -type d -name tests -printf '%h\n' | xargs -n1 basename | sort)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch -q origin "$BASE_REF"
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
            TOUCHED=$(printf '%s\n' "$CHANGED" | sed -n 's|^packages/python/\([^/]*\)/.*|\1|p' | sort -u)
            PKGS=$(comm -12 <(printf '%s\n' "$ALL") <(printf '%s\n' "$TOUCHED"))
            if printf '%s\n' "$CHANGED" | grep -qx '.github/workflows/ci.yml'; then
              PKGS="$ALL"
            fi
            if [ -z "$PKGS" ]; then
              # Smoke floor: keeps the required check honest on docs-only PRs.
              PKGS="hummbl-governance"
            fi
          else
            PKGS="$ALL"
          fi
          PKG_JSON=$(printf '%s\n' "$PKGS" | jq -R . | jq -cs .)
          INC=[]
          if printf '%s\n' "$PKGS" | grep -qx hummbl; then
            INC=$(printf '%s' "$INC" | jq '. += [{"package":"hummbl","python-version":"3.10"}]')
          fi
          if printf '%s\n' "$PKGS" | grep -qx hummbl-kernel; then
            INC=$(printf '%s' "$INC" | jq '. += [{"package":"hummbl-kernel","python-version":"3.10"}]')
          fi
          MATRIX=$(jq -nc --argjson pkgs "$PKG_JSON" --argjson inc "$INC" \
            '{"python-version":["3.11","3.12","3.13","3.14"],"package":$pkgs,"include":$inc}')
          echo "matrix=$MATRIX"
          echo "json=$MATRIX" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Main test matrix: on push to main, every package x every supported Python
  # version; on pull_request, only the packages the PR touched (see `changes`).
  #
  # Most packages declare requires-python = ">=3.11". Two packages (hummbl,
  # hummbl-kernel) declare >=3.10 and get an extra 3.10 entry via `include`.
  #
  # Coverage reporting is conditional on the package name so only
  # hummbl-governance gets --cov (preserving the GAP-003 intent).
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.package }}, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        working-directory: packages/python/${{ matrix.package }}
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: packages/python/${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = "hummbl-governance" ]; then
            python -m pytest tests/ -q --cov=hummbl_governance --cov-report=term
          else
            python -m pytest tests/ -q
          fi

  # ---------------------------------------------------------------------------
  # Future-preview matrix: all packages on Python 3.15-dev.
  #
  # continue-on-error means failures here do NOT block the PR. The job is
  # informational only -- it surfaces breakages early so they can be fixed
  # before 3.15 ships stable (~Oct 2026).
  # ---------------------------------------------------------------------------
  test-preview:
    name: test-preview (${{ matrix.package }}, 3.15-dev)
    runs-on: ubuntu-latest
    # Informational only - runs on push to main, not on PRs.
    # Cuts 46 jobs from every PR while preserving full preview coverage on main.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [base120, governed-compression, hummbl, hummbl-agent-eval-harness, hummbl-agent-governance, hummbl-eval, hummbl-gitops, arcana, hummbl-axis, hummbl-bif, hummbl-bus, hummbl-cognition, hummbl-compass, hummbl-contracts, hummbl-design-tokens, hummbl-evidence, hummbl-free-models, hummbl-garage, hummbl-governance, hummbl-heraldry, hummbl-identity, hummbl-intel, hummbl-invariance, hummbl-kernel, hummbl-lattice, hummbl-lint-config, hummbl-mcp, hummbl-mcp-base120, hummbl-mcp-basen, hummbl-mcp-bif, hummbl-mcp-cognitive-ledger, hummbl-mcp-coordination-bus, hummbl-mcp-discord, hummbl-mcp-governance, hummbl-mcp-omnichannel, hummbl-mcp-onepassword, hummbl-mcp-proton, hummbl-mcp-signal, hummbl-mcp-utf, hummbl-mcp-voice, hummbl-rubric-templates, hummbl-sast, hummbl-taxonomy, hummbl-tuples, hummbl-validation, hummbl-validation-framework, idp-spec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15-dev"

      - name: Install package and test dependencies
        working-directory: packages/python/${{ matrix.package }}
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: packages/python/${{ matrix.package }}
        run: python -m pytest tests/ -q

  test-node:
    name: test (node, ${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mcp-base120]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: packages/node/${{ matrix.package }}/package-lock.json

      - name: Install package
        working-directory: packages/node/${{ matrix.package }}
        run: npm ci

      - name: Test product admission validator
        run: node --test tools/scripts/test_validate_product_manifests.mjs

      - name: Validate product manifests
        run: node tools/scripts/validate_product_manifests.mjs

      - name: Verify generated artifacts
        working-directory: packages/node/${{ matrix.package }}
        run: npm run check:generated

      - name: Run tests
        working-directory: packages/node/${{ matrix.package }}
        run: npm test

      - name: Verify package contents
        working-directory: packages/node/${{ matrix.package }}
        run: npm run check:boundary

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Check LICENSE/pyproject.toml consistency
        run: python .github/scripts/check_license_consistency.py

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit packages with dependencies
        run: |
          set -e
          # Most packages are stdlib-only (zero runtime deps).
          # Only audit packages that declare runtime dependencies.
            # Resolve each project's complete dependency graph in isolation.
            # Freeze excludes only the local editable project, which may not
            # be published yet. Strict auditing still covers every resolved
            # dependency; --no-deps uses these exact pins without re-resolution.
            audit_root=$(mktemp -d "$RUNNER_TEMP/dependency-audit.XXXXXX")
            trap 'rm -rf -- "$audit_root"' EXIT
            for pkg_dir in packages/python/governed-compression packages/python/hummbl-bus packages/python/hummbl-cognition; do
              echo "::group::Auditing $(basename $pkg_dir)"
              audit_env="$audit_root/$(basename "$pkg_dir")"
              python -m venv "$audit_env"
              "$audit_env/bin/python" -m pip install -e "$pkg_dir" -q
              "$audit_env/bin/python" -m pip freeze --exclude-editable > "$audit_env/dependencies.txt"
              pip-audit --strict --no-deps --disable-pip -r "$audit_env/dependencies.txt"
              echo "::endgroup::"
          done

  build-lock-check:
    name: build-lock-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Every package has a current requirements-build.lock
        # Stdlib only. The publish workflow refuses to build from a missing or
        # stale lock; this job surfaces that on the PR instead of at release.
        run: python .github/scripts/lock_build_env.py check-inputs --all

  claim-drift-check:
    name: claim-drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Check hummbl-governance public count claims against PrimitiveRegistry
        # Catches the class of drift from the 2026-09-11 "34 primitives" incident:
        # a doc/README count silently diverging from the actual registry. See
        # docs/artifacts/AUDIT_2026-09-11_public_claims_drift.md.
        run: python packages/python/hummbl-governance/scripts/check_public_count_claims.py

  # ---------------------------------------------------------------------------
  # Docker-based test job for hummbl-governance.
  #
  # Verifies the multi-stage Dockerfile (packages/python/hummbl-governance/)
  # stays green and reproduces CI locally:
  #   docker build -t hummbl-governance-ci packages/python/hummbl-governance/
  #   docker run hummbl-governance-ci
  #
  # One test is deselected: test_resolve_workspace_for_file expects .git/ to
  # exist (it walks up looking for a git workspace root). The .dockerignore
  # intentionally excludes .git/ to keep the image lean. This test passes in
  # the regular CI job (which uses actions/checkout) and locally.
  # ---------------------------------------------------------------------------
  docker-test:
    name: docker-test (hummbl-governance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t hummbl-governance-ci packages/python/hummbl-governance/

      - name: Run tests in container
        run: |
          docker run --rm hummbl-governance-ci \
            python -m pytest tests/ -q \
            --deselect tests/lsp_registry/test_lsp_registry.py::TestWorkspaceUtils::test_resolve_workspace_for_file

  # Single required-check context for branch protection.
  # Do not require the per-package names -- they churn when packages are added.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, test-preview, pip-audit, build-lock-check, claim-drift-check, docker-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs to succeed
        run: |
          echo "test=${{ needs.test.result }}"
          echo "test-preview=${{ needs.test-preview.result }}"
          echo "pip-audit=${{ needs.pip-audit.result }}"
          echo "build-lock-check=${{ needs.build-lock-check.result }}"
          echo "claim-drift-check=${{ needs.claim-drift-check.result }}"
          echo "docker-test=${{ needs.docker-test.result }}"
          # test-preview has continue-on-error so its result is always
          # success -- it is informational only and does not gate merges.
          test "${{ needs.test.result }}" = success

          test "${{ needs.pip-audit.result }}" = success
          test "${{ needs.build-lock-check.result }}" = success
          test "${{ needs.claim-drift-check.result }}" = success
          test "${{ needs.docker-test.result }}" = success
