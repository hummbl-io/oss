name: Tests

"on":
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/ci.yml"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [base120, governed-compression, hummbl, hummbl-bif, hummbl-bus, hummbl-cognition, hummbl-compass, hummbl-free-models, hummbl-governance, hummbl-kernel, hummbl-rubric-templates, hummbl-taxonomy, hummbl-tuples, hummbl-validation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        working-directory: packages/python/${{ matrix.package }}
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: packages/python/${{ matrix.package }}
        run: python -m pytest tests/ -q

  # Targeted extra matrix for hummbl-governance (GAP-003).
  # Other packages stay on the 3.13-only job above.
  # GAP-003 stays open until the first green public run of this job.
  test-hummbl-governance:
    name: test (hummbl-governance, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        working-directory: packages/python/hummbl-governance
        run: pip install -e ".[test]"

      - name: Run tests with coverage
        working-directory: packages/python/hummbl-governance
        run: python -m pytest tests/ -q --cov=hummbl_governance --cov-report=term

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit packages with dependencies
        run: |
          set -e
          # Most packages are stdlib-only (zero runtime deps).
          # Only audit packages that declare runtime dependencies AND are
          # published on PyPI (pip-audit --strict fails on unpublished packages).
          for pkg_dir in packages/python/governed-compression packages/python/hummbl-bus packages/python/hummbl-cognition; do
            echo "::group::Auditing $(basename $pkg_dir)"
            cd "$pkg_dir"
            pip install -e . -q 2>/dev/null
            pip-audit --strict
            cd - > /dev/null
            echo "::endgroup::"
          done
