name: Boundary check

# Public/private boundary enforcement.
# Runs gitleaks for secret detection and a custom pattern denylist
# to catch internal artifact leakage (handoffs, AARs, receipts,
# private-status markers and fleet inventory).
#
# See AGENTS.md "Public/private boundary" section for the policy.

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose

  pattern-denylist:
    name: pattern-denylist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Test pattern denylist checker
        run: python -m unittest discover -s tools/scripts -p test_check_boundary_patterns.py -v

      - name: Run pattern denylist check
        run: python tools/scripts/check_boundary_patterns.py
