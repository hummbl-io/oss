name: CodeQL

# Semantic code analysis for Python packages.
# Runs on PRs and weekly on main.

"on":
  push:
    branches: [main]
    paths:
      - "packages/**/*.py"
  pull_request:
    paths:
      - "packages/**/*.py"
  schedule:
    - cron: "22 4 * * 1"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (python)
    # GitHub-hosted compute unavailable for private org; fleet policy
    # is self-hosted Linux.
    runs-on: ubuntu-24.04
    # GHAS disabled 2026-09-16: SARIF upload requires Code Security on
    # private repos. Skipped until org/repo var HUMMBL_GHAS_ENABLED=true.
    if: vars.HUMMBL_GHAS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: "/language:python"
