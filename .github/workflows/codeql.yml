name: CodeQL

# Semantic code analysis for Python packages.
# Runs on PRs and weekly on main.

"on":
  push:
    branches: [main]
    paths:
      - "packages/**/*.py"
  pull_request:
    paths:
      - "packages/**/*.py"
  schedule:
    - cron: "22 4 * * 1"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (python)
    # GitHub-hosted compute unavailable for private org; fleet policy
    # is self-hosted Linux.
    runs-on: ubuntu-24.04
    # This job runs unconditionally. The 2026-09-16 note about GHAS gating
    # was never implemented as an `if:` condition and is stale: this repo is
    # public, where code scanning/SARIF upload does not require a GHAS
    # license, and runs on main and PRs conclude success. If the repo ever
    # goes private, gate this job on vars.HUMMBL_GHAS_ENABLED at that time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          category: "/language:python"
