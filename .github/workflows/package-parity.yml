name: Package parity

# Enforces the inventory + lockfile contracts from AGENTS.md (oss#264):
#   - every packages/python/<pkg> must appear in docs/architecture/PACKAGES.md
#   - every package with project.dependencies must carry a
#     requirements.lock, and the lock's direct-dep pin set must match
#     the declared dependency names with satisfying versions
#
# Freshness is structural (declared deps vs lock pins), not
# re-resolution — a lock remains fresh until pyproject.toml deps change,
# regardless of upstream releases.

"on":
  pull_request:
    paths:
      - packages/python/*/pyproject.toml
      - packages/python/*/requirements.lock
      - docs/architecture/PACKAGES.md
      - .github/scripts/check_package_parity.py
      - .github/workflows/package-parity.yml
  push:
    branches: [main]
    paths:
      - packages/python/*/pyproject.toml
      - packages/python/*/requirements.lock
      - docs/architecture/PACKAGES.md
      - .github/scripts/check_package_parity.py
      - .github/workflows/package-parity.yml

permissions:
  contents: read

jobs:
  parity:
    name: package-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Check package inventory + lock parity
        run: python .github/scripts/check_package_parity.py
