name: Publish to PyPI

# Trusted Publishing (OIDC) -- no API tokens.
# Each package is configured as a trusted publisher on pypi.org pointing to
# this repo + this workflow + the `pypi` environment.
#
# To publish a package:
#   1. Configure the trusted publisher on pypi.org for that package
#      (owner: hummbl-io, repo: oss, workflow: publish-pypi.yml, environment: pypi)
#   2. Merge the version bump to main
#   3. Tag the merge commit: git tag python/hummbl-governance/v1.4.2 && git push origin python/hummbl-governance/v1.4.2
#
# To add a new Python package:
#   1. Add its tag pattern to the `tags` filter below
#   2. Add its source under packages/python/<name>/
#   3. Configure the trusted publisher on pypi.org

"on":
  push:
    tags:
      # Also covers hummbl-agent-eval-harness and hummbl-sast when a release
      # is separately prepared; adding source packages creates no tags.
      - "python/*/v*"
  workflow_dispatch:
    # Rehearsal path: publish to TestPyPI to prove attestation/verifier wiring
    # without consuming a real PyPI version. Requires a TestPyPI Trusted
    # Publisher (owner hummbl-io, repo oss, workflow publish-pypi.yml,
    # environment testpypi). Never creates a GitHub Release or verifies prod.
    inputs:
      package:
        description: "Package directory name under packages/python/ (e.g. hummbl-bus)"
        required: true
      version:
        description: "Version to build and publish; must match pyproject.toml"
        required: true
      repository_url:
        description: "Index URL for the rehearsal"
        required: false
        default: "https://test.pypi.org/legacy/"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}
      path: ${{ steps.pkg.outputs.path }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve package name and version
        id: pkg
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pkg="$INPUT_PACKAGE"
            ver="$INPUT_VERSION"
          else
            # tag format: python/<package-name>/v<version>
            rest="${REF_NAME#python/}"
            pkg="${rest%%/v*}"
            ver="${rest#*/v}"
          fi
          echo "name=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "path=packages/python/$pkg" >> "$GITHUB_OUTPUT"

      - name: Refuse known-bad governance v1.5.0 tag (issue 143)
        if: github.event_name == 'push'
        run: |
          # Lightweight tag python/hummbl-governance/v1.5.0 pointed at 4d40da8.
          # Do not re-run Publish on this tag. See github.com/hummbl-io/oss/issues/143
          if [ "${{ steps.pkg.outputs.name }}" = "hummbl-governance" ] && [ "${{ steps.pkg.outputs.version }}" = "1.5.0" ]; then
            echo "ERROR: issue #143 - do not re-run Publish on python/hummbl-governance/v1.5.0"
            exit 1
          fi
          echo "OK: tag is not the blocked governance v1.5.0 publish."

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: tag $GITHUB_REF_NAME is not an ancestor of main."
            echo "Releases must come from main. Merge the branch first, then tag the merge commit."
            exit 1
          fi
          echo "OK: tag is on main."

      - name: Verify version matches pyproject.toml
        working-directory: ${{ steps.pkg.outputs.path }}
        run: |
          pyproject_ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_ver="${{ steps.pkg.outputs.version }}"
          if [ "$pyproject_ver" != "$tag_ver" ]; then
            echo "ERROR: pyproject.toml version ($pyproject_ver) != tag version ($tag_ver)"
            exit 1
          fi
          echo "OK: version matches ($pyproject_ver)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Verify hash-locked build environment is current
        # Stdlib-only check: the lock must exist and must have been generated
        # from the current pyproject.toml inputs. Fails closed on a missing or
        # stale lock so an unpinned build can never publish.
        run: python .github/scripts/lock_build_env.py check-inputs "${{ steps.pkg.outputs.name }}"

      - name: Install hash-locked build environment
        working-directory: ${{ steps.pkg.outputs.path }}
        # Everything the build job needs (build backend, runtime deps, test
        # extra, build front-end, SBOM generator) is pinned by SHA-256 in
        # requirements-build.lock. pip refuses any file whose hash is not
        # listed, so a poisoned upstream release cannot enter this job even
        # with valid provenance of its own.
        run: pip install --require-hashes -r requirements-build.lock

      - name: Install package (no resolver, no build isolation)
        working-directory: ${{ steps.pkg.outputs.path }}
        run: pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        working-directory: ${{ steps.pkg.outputs.path }}
        run: python -m pytest tests/ -q

      - name: Build package
        working-directory: ${{ steps.pkg.outputs.path }}
        # --no-isolation: use the hash-locked setuptools/wheel already
        # installed instead of letting `build` download a fresh backend.
        run: python -m build --no-isolation

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.1
        with:
          name: dist
          path: ${{ steps.pkg.outputs.path }}/dist/

      - name: Generate SBOM
        working-directory: ${{ steps.pkg.outputs.path }}
        run: |
          # Per-artifact SBOM: scan a clean venv containing only the built
          # wheel and its runtime deps (not test extras like pytest).
          # The venv is filled offline from a wheelhouse that pip downloaded
          # under --require-hashes, so the SBOM venv never touches the index.
          pip download --require-hashes -r requirements-build.lock -d /tmp/wheelhouse --quiet
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --no-index --find-links /tmp/wheelhouse dist/*.whl cyclonedx-bom
          /tmp/sbom-venv/bin/cyclonedx-py environment --output-reproducible -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.1
        with:
          name: sbom
          path: ${{ steps.pkg.outputs.path }}/sbom.json

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      contents: write   # create GitHub Release
      id-token: write   # OIDC for trusted publishing + sigstore + provenance
      attestations: write  # attest-build-provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: .

      # Fail-closed ordering: checksums, provenance attestation, and sigstore
      # signing all run BEFORE the irreversible PyPI upload. If any fails, no
      # version is published, so the version number is not burned on an
      # unattested artifact. Previously the upload ran first, so a failure in
      # attestation left an unreleased, unattested artifact on PyPI forever
      # (issue #345 A-10: hummbl-bus 0.2.1 attestation step failed post-upload).
      - name: Generate checksums
        id: checksums
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > checksums-sha256.txt
          echo "path=dist/checksums-sha256.txt" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # subject-path takes a single glob; "dist/*.whl dist/*.tar.gz" is
          # treated as one literal path and fails ("Could not find subject").
          subject-path: dist/*

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
          upload-signing-artifacts: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          # Real tag -> PyPI; workflow_dispatch -> TestPyPI rehearsal URL.
          repository-url: ${{ github.event_name == 'workflow_dispatch' && inputs.repository_url || 'https://upload.pypi.org/legacy/' }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums-sha256.txt
            sbom.json

  # Post-publish guarantee: nothing above proves that PyPI actually received
  # PEP 740 provenance, that the GitHub repo attestation exists, or that the
  # Release was cut. This job asserts all three against live external state and
  # fails closed. It can be re-run independently without re-publishing. This is
  # the check that would have caught A-10 automatically.
  verify-publish:
    name: verify-publish
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Verify GitHub build-provenance attestation for every artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.whl dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no dist artifacts to verify"; exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::attestation verify $f"
            gh attestation verify "$f" --repo "${{ github.repository }}"
            echo "::endgroup::"
          done

      - name: Verify PyPI PEP 740 provenance for every artifact
        env:
          PKG: ${{ needs.build.outputs.name }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*.whl dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no dist artifacts to verify"; exit 1
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            url="https://pypi.org/integrity/${PKG}/${VER}/${name}/provenance"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$code $url"
            if [ "$code" != "200" ]; then
              echo "ERROR: no PEP 740 provenance at $url (got $code)"; exit 1
            fi
          done

      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null
