name: Publish to PyPI

# Trusted Publishing (OIDC) -- no API tokens.
# Each package is configured as a trusted publisher on pypi.org pointing to
# this repo + this workflow + the `pypi` environment.
#
# To publish a package:
#   1. Configure the trusted publisher on pypi.org for that package
#      (owner: hummbl-io, repo: oss, workflow: publish-pypi.yml, environment: pypi)
#   2. Merge the version bump to main
#   3. Tag the merge commit: git tag python/hummbl-governance/v1.4.2 && git push origin python/hummbl-governance/v1.4.2
#
# To add a new Python package:
#   1. Add its tag pattern to the `tags` filter below
#   2. Add its source under packages/python/<name>/
#   3. Configure the trusted publisher on pypi.org

"on":
  push:
    tags:
      - "python/hummbl-governance/v*"
      - "python/hummbl/v*"
      - "python/hummbl-kernel/v*"
      - "python/base120/v*"
      - "python/governed-compression/v*"
      - "python/hummbl-bif/v*"
      - "python/hummbl-bus/v*"
      - "python/hummbl-cognition/v*"
      - "python/hummbl-tuples/v*"
      - "python/hummbl-compass/v*"
      - "python/hummbl-free-models/v*"
      - "python/hummbl-rubric-templates/v*"
      - "python/hummbl-taxonomy/v*"
      - "python/hummbl-validation/v*"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Extract package name and version from tag
        id: pkg
        run: |
          # tag format: python/<package-name>/v<version>
          rest="${GITHUB_REF_NAME#python/}"
          pkg="${rest%%/v*}"
          ver="${rest#*/v}"
          echo "name=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "path=packages/python/$pkg" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: tag $GITHUB_REF_NAME is not an ancestor of main."
            echo "Releases must come from main. Merge the branch first, then tag the merge commit."
            exit 1
          fi
          echo "OK: tag is on main."

      - name: Verify version matches pyproject.toml
        working-directory: ${{ steps.pkg.outputs.path }}
        run: |
          pyproject_ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_ver="${{ steps.pkg.outputs.version }}"
          if [ "$pyproject_ver" != "$tag_ver" ]; then
            echo "ERROR: pyproject.toml version ($pyproject_ver) != tag version ($tag_ver)"
            exit 1
          fi
          echo "OK: version matches ($pyproject_ver)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        working-directory: ${{ steps.pkg.outputs.path }}
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: ${{ steps.pkg.outputs.path }}
        run: python -m pytest tests/ -q

      - name: Install build tools
        run: pip install "build>=1.0"

      - name: Build package
        working-directory: ${{ steps.pkg.outputs.path }}
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: dist
          path: ${{ steps.pkg.outputs.path }}/dist/

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
