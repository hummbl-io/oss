name: Validate workflows

"on":
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/scripts/validate_workflows.py"
  push:
    paths:
      - ".github/workflows/**"
      - "tools/scripts/validate_workflows.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/scripts/validate_workflows.py
