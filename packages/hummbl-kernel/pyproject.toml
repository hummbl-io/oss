[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hummbl-kernel"
version = "0.1.0"
description = "HUMMBL orchestration kernel — lightweight workflow execution with security, compliance, and fleet coordination"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Reuben Bowlby", email = "reuben@hummbl.io" },
    { name = "HUMMBL, LLC" },
]
keywords = ["orchestration", "kernel", "agent", "compliance", "fleet", "workflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
# Reasoning integration: opt-in dependency on the hummbl reasoning library.
# Kernel stays stdlib-only by default; consumers that want reasoning
# artifact integration (plans, hypotheses, evaluations as kernel inputs)
# install with pip install "hummbl-kernel[reasoning]".
reasoning = ["hummbl>=0.1.0"]
test = ["pytest>=7,<10"]

[project.urls]
Homepage = "https://hummbl.io"
Repository = "https://github.com/hummbl-io/oss"
Documentation = "https://github.com/hummbl-io/oss/tree/main/packages/hummbl-kernel"
Issues = "https://github.com/hummbl-io/oss/issues"

[tool.setuptools.packages.find]
include = ["kernel*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
