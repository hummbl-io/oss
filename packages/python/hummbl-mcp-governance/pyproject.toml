[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hummbl-mcp-governance"
version = "0.1.0"
description = "MCP servers exposing HUMMBL governance primitives"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "HUMMBL Open Source", email = "oss@hummbl.io" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "hummbl-governance>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/hummbl-io/oss"
Documentation = "https://github.com/hummbl-io/oss/tree/main/packages/python/hummbl-mcp-governance/README.md"
Repository = "https://github.com/hummbl-io/oss"
Issues = "https://github.com/hummbl-io/oss/issues"
PyPI = "https://pypi.org/project/hummbl-mcp-governance/"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
hummbl-governance-mcp = "governance_mcp_server:main"
hummbl-compliance-mcp = "governance_mcp_compliance:main"
hummbl-sandbox-mcp = "governance_mcp_sandbox:main"
hummbl-identity-mcp = "governance_mcp_identity:main"
hummbl-agent-monitor-mcp = "governance_mcp_agent_monitor:main"
hummbl-reasoning-mcp = "governance_mcp_reasoning:main"
hummbl-physical-mcp = "governance_mcp_physical:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "governance_mcp_server",
    "governance_mcp_compliance",
    "governance_mcp_sandbox",
    "governance_mcp_identity",
    "governance_mcp_agent_monitor",
    "governance_mcp_reasoning",
    "governance_mcp_physical",
]
