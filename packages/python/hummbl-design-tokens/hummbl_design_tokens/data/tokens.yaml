# ---------------------------------------------------------------------------
# Trust tier colors
# Luminance-differentiated: darker = higher trust (CVD/monochrome resilient)
# ---------------------------------------------------------------------------
trust_tiers:
  OWNER:
    hex: "#1E3A8A"
    luminance: darkest
    heraldic_cadency: none
    description: "Sovereign — operator only"
  TRUSTED:
    hex: "#15803D"
    luminance: dark
    heraldic_cadency: "label of three points"
    description: "Full autonomy, critical peer"
  MEDIUM-HIGH:
    hex: "#B45309"
    luminance: medium
    heraldic_cadency: crescent
    description: "Supervised execution, most agents"
  MEDIUM:
    hex: "#B45309"
    luminance: medium-light
    heraldic_cadency: mullet
    description: "Constrained autonomy"
  PROBATIONARY:
    hex: "#DC2626"
    luminance: light
    heraldic_cadency: "bordure compony"
    description: "Read-mostly, under evaluation"

# ---------------------------------------------------------------------------
# Bus message type colors
# Never color-only: each type has color + icon + ICS flag + shape + abbreviation
# ---------------------------------------------------------------------------
bus_types:
  PROPOSAL:
    hex: "#A21CAF"
    icon: "📋"
    ics_flag: "Papa"
    shape: diamond
    abbreviation: P
  ACK:
    hex: "#15803D"
    icon: "✓"
    ics_flag: Alfa
    shape: circle
    abbreviation: A
  STATUS:
    hex: "#2563EB"
    icon: "◆"
    ics_flag: Sierra
    shape: square
    abbreviation: S
  SITREP:
    hex: "#0891B2"
    icon: "📊"
    ics_flag: Uniform
    shape: hexagon
    abbreviation: R
  BLOCKED:
    hex: "#DC2626"
    icon: "✗"
    ics_flag: November
    shape: triangle
    abbreviation: B
  DECISION:
    hex: "#7C3AED"
    icon: "⚖"
    ics_flag: Delta
    shape: octagon
    abbreviation: D
  QUESTION:
    hex: "#CA8A04"
    icon: "?"
    ics_flag: Quebec
    shape: pentagon
    abbreviation: Q
  MILESTONE:
    hex: "#D97706"
    icon: "★"
    ics_flag: Mike
    shape: star
    abbreviation: M
  SKILL_INVOKE:
    hex: "#0D9488"
    icon: "⚡"
    ics_flag: "Custom (green-white-green)"
    shape: bolt
    abbreviation: K

# ---------------------------------------------------------------------------
# Status colors
# Safety-critical: AAA (7:1) contrast target. Never color-only.
# ---------------------------------------------------------------------------
status:
  HEALTHY:
    hex: "#22C55E"
    icon: "✓"
    shape: circle
    contrast_target: AAA
  DEGRADED:
    hex: "#F59E0B"
    icon: "⚠"
    shape: triangle
    contrast_target: AAA
  CRITICAL:
    hex: "#FCA5A5"
    icon: "✗"
    shape: square
    contrast_target: AAA

# ---------------------------------------------------------------------------
# Typography
# ---------------------------------------------------------------------------
typography:
  primary_ui_sans:
    family: Inter
    license: OFL
    fallback: ["-apple-system", "Segoe UI", "Roboto", "sans-serif"]
    usage: "Dashboard chrome, docs, marketing body"
  primary_mono:
    family: "JetBrains Mono"
    license: OFL
    fallback: ["Iosevka Term"]
    usage: "Editors, diffs, TUI, data displays, instance IDs"
    ligatures: false
    safe_ligatures_feature: ss19
  tui_icons:
    family: "JetBrains Mono Nerd Font"
    license: OFL
    usage: "Terminal status bars, bus indicators"
    pin_version: true
  agent_identity:
    family: Monaspace
    license: OFL
    voices:
      Neon: "System / infra"
      Argon: "Analyst / research"
      Xenon: "Knowledge / docs"
      Radon: "Creative / generation"
      Krypton: "Ops / exec"
  non_latin:
    cjk: "Noto Sans Mono CJK"
    arabic: "IBM Plex Sans Arabic"
    emoji: "Noto Color Emoji"
  type_scale:
    ratio: 1.125
    steps: 7
    name: "Major Second"
  fontconfig:
    hintstyle: hintslight
    rgba: rgb
  tabular_nums: true

# ---------------------------------------------------------------------------
# Livery system
# ---------------------------------------------------------------------------
livery:
  base: "#0F0F12"
  patterns: [solid, striped, dotted, gradient]
  finishes: [matte, metallic, pearl, candy, color-shift]
  presets:
    Martini:
      colors: ["#0075C5", "#C8102E", "#FFFFFF"]
      origin: "Martini Racing (Porsche 917, Lancia)"
    Gulf:
      colors: ["#F58025", "#EAEAEA", "#0075C5"]
      origin: "Gulf Oil (Ford GT40, Porsche 917K)"
    John_Player_Special:
      colors: ["#0D0D0D", "#C8B560", "#FFFFFF"]
      origin: "Lotus F1 (1970s)"
    Rothmans:
      colors: ["#0D4EA6", "#EAEAEA", "#D4AF37"]
      origin: "Porsche 956/962"
    Castrol:
      colors: ["#006B3C", "#D4AF37", "#FFFFFF"]
      origin: "Castrol Racing"
  insignia:
    icons: [shield, gear, scroll, lens, compass, wrench, star]
    role_mapping:
      Engineer: gear
      Memory: scroll
      Scanner: lens
      Research: compass
      Ops: wrench
      Coordinator: star

# ---------------------------------------------------------------------------
# Heraldic grammar
# ---------------------------------------------------------------------------
heraldry:
  shield_shapes: 7
  tinctures: 9
  divisions: 10
  ordinaries: 8
  charges: 30
  total_combinations: 21600
  generation: "SHA-256(agent_name) -> hash bytes -> heraldic parameters"
  layers: 7
  fleet_blazon: "Sable, a pall reversed between in chief two mullets Argent and in base a cogwheel Or"

# ---------------------------------------------------------------------------
# Terminal rendering
# ---------------------------------------------------------------------------
terminal:
  base_theme: "Catppuccin Mocha"
  semantic_override: true
  rendering_priority:
    - truecolor
    - "256-color"
    - "ANSI-16"
  detection: "COLORTERM -> NO_COLOR -> $TERM"
  sync_output: "?2026h"

# ---------------------------------------------------------------------------
# Accessibility
# ---------------------------------------------------------------------------
accessibility:
  min_contrast_text: "4.5:1"
  min_contrast_safety_critical: "7:1"
  min_de2000_agent_colors: 10
  cvd_test_types: [protanopia, deuteranopia, tritanopia, achromatopsia]
  rule: "Never color-only — every indicator has color + icon + label + shape"
