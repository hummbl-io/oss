# HUMMBL Design Tokens — Canonical Source of Truth
#
# All visual identity tokens for the HUMMBL fleet. Every output format
# (Base24, CSS, Python, TypeScript, livery, docs) is derived from this file.
#
# Color space: OKLCH-authored, hex for consumption.
# Dark mode is primary. Light variants derived by OKLCH lightness adjustment.
# See: hummbl-io/design-reference/docs/2026-09-02-swarm-synthesis-master-design-decisions.md

meta:
  version: "0.1.0"
  authored: "2026-09-02"
  color_space: OKLCH
  dark_mode: primary
  canonical_surface: "#0F0F12"

# ---------------------------------------------------------------------------
# Surfaces (dark mode primary)
# ---------------------------------------------------------------------------
surfaces:
  base: "#0F0F12"
  elevated: "#1A1A20"
  raised: "#24242C"
  text_body: "#E5E7EB"
  text_muted: "#9CA3AF"
  border: "#333338"
  border_focus: "#4A4A52"

# ---------------------------------------------------------------------------
# Agent identity colors
# Golden ratio HSL: phi=0.618, S=85%, L=65% (light) / 55% (dark)
# Seeded by agent name hash. Validated: dE2000 > 10, deuteranopia sim pass.
# ---------------------------------------------------------------------------
agents:
  devin:
    hue: 0
    hex_light: "#F23645"
