[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hummbl-axis"
version = "0.1.0"
description = "Axis — the ladder that selects which Atlas contradiction to act on. Closes the lattice-ladder-loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HUMMBL, LLC", email = "dev@hummbl.io" }]
keywords = ["atlas", "axis", "governance", "contradiction", "ladder-lattice-loop", "hummbl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/hummbl-io/oss"
Documentation = "https://github.com/hummbl-io/oss/tree/main/packages/python/hummbl-axis/README.md"
Repository = "https://github.com/hummbl-io/oss"
Issues = "https://github.com/hummbl-io/oss/issues"
PyPI = "https://pypi.org/project/hummbl-axis/"

[project.optional-dependencies]
test = ["pytest>=8.3.4,<10.0", "pytest-cov>=5.0,<7.0"]

[project.scripts]
axis = "hummbl_axis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
