[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hummbl-heraldry"
version = "0.1.0"
description = "HUMMBL Procedural Heraldic Identity System — SHA-256 agent arms generator"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "HUMMBL Open Source", email = "oss@hummbl.io" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/hummbl-io/oss"
Repository = "https://github.com/hummbl-io/oss"
Documentation = "https://github.com/hummbl-io/oss"

[project.scripts]
hummbl-heraldry = "hummbl_heraldry.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
hummbl_heraldry = ["data/*.json"]
