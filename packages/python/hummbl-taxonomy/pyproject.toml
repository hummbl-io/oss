[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hummbl-taxonomy"
version = "0.1.0"
description = "HUMMBL Governed Intelligence Tier Taxonomy & Classifier"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "HUMMBL Open Source", email = "oss@hummbl.io" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/hummbl-io/oss"
Documentation = "https://github.com/hummbl-io/oss/tree/main/packages/python/hummbl-taxonomy/README.md"
Repository = "https://github.com/hummbl-io/oss"
Issues = "https://github.com/hummbl-io/oss/issues"
PyPI = "https://pypi.org/project/hummbl-taxonomy/"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hummbl_taxonomy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/hummbl_taxonomy"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

