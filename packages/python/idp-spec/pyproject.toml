[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-spec"
version = "0.1.0"
description = "HUMMBL Intelligent Delegation Profile (IDP) — deterministic delegation for multi-agent systems"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "HUMMBL, LLC", email = "dev@hummbl.io" },
]
keywords = [
    "agent",
    "ai",
    "delegation",
    "governance",
    "security",
    "capability",
    "token",
    "audit",
    "hummbl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
governance = ["hummbl-governance>=1.1.0"]
test = ["pytest>=8.3.4,<10.0", "pytest-cov>=5.0,<7.0"]

[project.urls]
Homepage = "https://github.com/hummbl-io/oss"
Documentation = "https://github.com/hummbl-io/oss/tree/main/packages/python/idp-spec/README.md"
Repository = "https://github.com/hummbl-io/oss"
Issues = "https://github.com/hummbl-io/oss/issues"
PyPI = "https://pypi.org/project/idp-spec/"

[tool.setuptools]
packages = ["idp_spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
