# HUMMBL Fleet Shared Lint Configuration
# Repos extend this via: extend = "hummbl-lint-config/ruff.toml"
# Or install the package and use: extend = "hummbl_lint_config/ruff.toml"

target-version = "py311"
line-length = 120

[lint]
select = [
    # F/E4/E7/E9 preserve ruff default checks when this config is
    # consumed via extend (a child select replaces defaults entirely).
    "F",
    "E4",
    "E7",
    "E9",
    # PLW1514 (missing encoding on open()) is preview-gated in ruff; enabling
    # preview activates unrelated preview rules fleet-wide, so it stays off.
    "B904",     # raise ... from err in except blocks
    "SIM",      # simplifications
    "I",        # isort import ordering
    "UP",       # pyupgrade — deprecated Python patterns
]
ignore = [
    "SIM108",   # if-else to ternary (readability)
    "SIM117",   # nested with statements (readability)
]

[lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # magic numbers OK in tests
"evals/*" = ["PLR2004"]
