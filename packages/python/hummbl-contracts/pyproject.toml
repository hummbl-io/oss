[project]
name = "hummbl-contracts"
version = "0.1.0"
description = "HUMMBL contract schemas and stdlib-only JSON Schema validator"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{ name = "HUMMBL, LLC", email = "dev@hummbl.io" }]
keywords = ["contracts", "schemas", "json-schema", "validation", "governance", "hummbl", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hummbl-io/oss"
Documentation = "https://github.com/hummbl-io/oss/tree/main/packages/python/hummbl-contracts/README.md"
Repository = "https://github.com/hummbl-io/oss"
Issues = "https://github.com/hummbl-io/oss/issues"
PyPI = "https://pypi.org/project/hummbl-contracts/"

[project.scripts]
hummbl-contracts = "hummbl_contracts.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8.3.4,<10.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hummbl_contracts*"]

[tool.setuptools.package-data]
hummbl_contracts = ["schemas/**/*.json"]
